/* ============================================================
   iRead - tek dosya e-kitap okuyucu
   ES5 + prefixli CSS. CSS Grid ve CSS degiskeni KULLANILMAZ
   (eski iPad Safari uyumlulugu icin).
   ============================================================ */
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-touch-callout: none;
  overflow: hidden;
}
body {
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 16px; line-height: 1.4;
  background: #F7F6F2; color: #17181B;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font-family: inherit; font-size: 16px; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
.hidden { display: none !important; }
.serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }

/* ---------- TEMA RENKLERI ---------- */
body.t-light  { background: #F7F6F2; color: #17181B; }
body.t-sepia  { background: #F1E7D3; color: #4A3B2A; }
body.t-night  { background: #101215; color: #E6E4DF; }

/* ---------- EKRANLAR ---------- */
.screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
#library { overflow-y: auto; -webkit-overflow-scrolling: touch; }
#reader  { overflow: hidden; }

/* ---------- KITAPLIK BASLIK ---------- */
#libHeader {
  padding: 18px 22px 10px 22px;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end;
  -webkit-justify-content: space-between; justify-content: space-between;
}
#libHeader h1 {
  margin: 0; font-size: 30px; letter-spacing: -0.4px; font-weight: 600;
  font-family: "Iowan Old Style", Palatino, Georgia, serif;
}
.hdr-sub { display: block; margin-top: 2px; font-size: 12px; opacity: .55; }
.hdr-actions { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
.ibtn {
  min-width: 46px; height: 46px; padding: 0 10px; margin-left: 8px;
  border-radius: 12px; background: rgba(0,0,0,.045);
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  -webkit-transition: -webkit-transform .12s ease, background .15s ease;
  transition: transform .12s ease, background .15s ease;
}
.ibtn:active { -webkit-transform: scale(.93); transform: scale(.93); }
.ibtn svg { width: 21px; height: 21px; display: block; }
.ibtn.primary { background: #2F5D50; color: #fff; font-size: 15px; font-weight: 500; padding: 0 16px; }
.ibtn.primary svg { margin-right: 6px; width: 17px; height: 17px; }
body.t-sepia .ibtn { background: rgba(74,59,42,.07); }
body.t-night .ibtn { background: rgba(255,255,255,.08); }
body.t-night .ibtn.primary { background: #3E7A69; color: #fff; }

/* ---------- ARAMA CUBUGU ---------- */
.searchbar { padding: 4px 22px 8px 22px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
.searchbar input {
  -webkit-appearance: none; appearance: none; border: 0; outline: none;
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  height: 42px; padding: 0 14px; border-radius: 11px;
  background: rgba(0,0,0,.05); color: inherit;
}
body.t-night .searchbar input { background: rgba(255,255,255,.09); }
.searchbar button { margin-left: 12px; color: #2F5D50; font-size: 15px; }
body.t-night .searchbar button { color: #7FB6A4; }

/* ---------- KOLEKSIYON SERIDI ---------- */
#collBar {
  padding: 6px 22px 14px 22px; white-space: nowrap;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.chip {
  display: inline-block; padding: 9px 16px; margin-right: 8px;
  border-radius: 20px; font-size: 14px; background: rgba(0,0,0,.05);
  -webkit-transition: background .15s ease; transition: background .15s ease;
}
body.t-night .chip { background: rgba(255,255,255,.08); }
.chip.on { background: #2F5D50; color: #fff; }
body.t-night .chip.on { background: #3E7A69; }
.chip.add { border: 1px dashed rgba(0,0,0,.2); background: none; }
body.t-night .chip.add { border-color: rgba(255,255,255,.25); }

/* ---------- SIMDI OKU ---------- */
#nowReading { padding: 0 22px 6px 22px; }
.now-card {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  padding: 16px; border-radius: 18px; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 20px rgba(0,0,0,.05);
}
body.t-sepia .now-card { background: #FBF4E5; }
body.t-night .now-card { background: #191C20; box-shadow: none; border: 1px solid rgba(255,255,255,.07); }
.now-cover { width: 84px; height: 126px; border-radius: 6px; overflow: hidden; -webkit-flex: none; flex: none; background: #ddd; }
.now-cover img { width: 100%; height: 100%; display: block; }
.now-meta { padding-left: 18px; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; }
.now-kicker { font-size: 12px; letter-spacing: .3px; opacity: .5; }
.now-title { font-size: 21px; margin: 3px 0 2px 0; font-family: "Iowan Old Style", Palatino, Georgia, serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-author { font-size: 13px; opacity: .55; }
.now-bar { height: 4px; border-radius: 2px; background: rgba(0,0,0,.09); margin: 12px 0 8px 0; overflow: hidden; }
body.t-night .now-bar { background: rgba(255,255,255,.13); }
.now-bar i { display: block; height: 100%; background: #B08A46; }
.now-go { display: inline-block; padding: 10px 18px; border-radius: 11px; background: #2F5D50; color: #fff; font-size: 15px; }
body.t-night .now-go { background: #3E7A69; }
.now-go:active { -webkit-transform: scale(.97); transform: scale(.97); }

/* ---------- RAFLAR ---------- */
#shelves { padding: 10px 22px 60px 22px; }
.shelf { margin-bottom: 26px; }
.shelf-label { font-size: 11px; letter-spacing: 1.2px; opacity: .35; margin-bottom: 10px; }
.shelf-row {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-flex-wrap: nowrap; flex-wrap: nowrap;
}
.shelf-board {
  height: 10px; margin-top: 10px; border-radius: 0 0 5px 5px;
  background: -webkit-linear-gradient(top, #D9CFC0, #C4B7A4);
  background: linear-gradient(to bottom, #D9CFC0, #C4B7A4);
  box-shadow: 0 6px 12px rgba(0,0,0,.07);
}
body.t-sepia .shelf-board { background: -webkit-linear-gradient(top, #D9C7A4, #C2AE87); background: linear-gradient(to bottom, #D9C7A4, #C2AE87); }
body.t-night .shelf-board { background: -webkit-linear-gradient(top, #262A2F, #1B1E22); background: linear-gradient(to bottom, #262A2F, #1B1E22); box-shadow: none; }

/* ---------- KITAP ---------- */
.book {
  width: 132px; margin-right: 20px; -webkit-flex: none; flex: none;
  position: relative;
  -webkit-transition: -webkit-transform .16s ease, opacity .16s ease;
  transition: transform .16s ease, opacity .16s ease;
}
.book:active { -webkit-transform: scale(.97); transform: scale(.97); }
.book.lifted { -webkit-transform: scale(1.04); transform: scale(1.04); opacity: .35; }
.book-cover {
  width: 132px; height: 198px; border-radius: 4px 7px 7px 4px;
  overflow: hidden; position: relative; background: #E3DED5;
  box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 10px 18px rgba(0,0,0,.13);
}
body.t-night .book-cover { box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 18px rgba(0,0,0,.45); }
.book-cover img { width: 100%; height: 100%; display: block; }
/* kitap sirti */
.book-cover:after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
  background: -webkit-linear-gradient(left, rgba(0,0,0,.28), rgba(0,0,0,0));
  background: linear-gradient(to right, rgba(0,0,0,.28), rgba(0,0,0,0));
}
.book-title { font-size: 13px; margin-top: 10px; line-height: 1.25; max-height: 32px; overflow: hidden; }
.book-sub { font-size: 11px; opacity: .5; margin-top: 3px; }
.book-prog { height: 3px; border-radius: 2px; background: rgba(0,0,0,.1); margin-top: 6px; overflow: hidden; }
body.t-night .book-prog { background: rgba(255,255,255,.14); }
.book-prog i { display: block; height: 100%; background: #B08A46; }
.book-more {
  position: absolute; right: 4px; top: 4px; width: 30px; height: 30px;
  border-radius: 15px; background: rgba(0,0,0,.42); color: #fff;
  font-size: 15px; line-height: 28px; text-align: center; letter-spacing: 1px;
}
.book-badge { position: absolute; left: 8px; top: 8px; font-size: 13px; }
.drop-mark { position: absolute; left: -11px; top: 0; width: 3px; height: 198px; border-radius: 2px; background: #B08A46; }
#dragGhost {
  position: fixed; z-index: 900; pointer-events: none; width: 132px;
  -webkit-transform-origin: 50% 50%; opacity: .92;
}
#dragGhost .book-cover { box-shadow: 0 18px 34px rgba(0,0,0,.4); }

/* ---------- LISTE GORUNUMU ---------- */
.list-row {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  padding: 12px 4px; position: relative;
  border-bottom: 1px solid rgba(0,0,0,.07);
}
body.t-night .list-row { border-bottom-color: rgba(255,255,255,.08); }
.list-row .book-cover { width: 52px; height: 78px; -webkit-flex: none; flex: none; }
.list-meta { padding-left: 16px; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; }
.list-title { font-size: 16px; }
.list-sub { font-size: 12px; opacity: .5; margin-top: 3px; }

/* ---------- BOS DURUM ---------- */
#emptyState { padding: 70px 30px; text-align: center; opacity: .6; }

/* ---------- READER ---------- */
#reader { background: #FFFFFF; }
body.t-sepia #reader { background: #F6EEDC; }
body.t-night #reader { background: #0D0F11; }
#readerStage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
#epubArea, #pdfArea, #demoArea { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
#pdfArea { overflow: auto; -webkit-overflow-scrolling: touch; text-align: center; }
#pdfCanvas { display: inline-block; margin: 12px auto; max-width: 100%; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
#demoArea { overflow: hidden; }
#demoInner {
  position: absolute; top: 0; left: 0; bottom: 0;
  -webkit-column-gap: 0; column-gap: 0;
  -webkit-transition: -webkit-transform .22s ease-out; transition: transform .22s ease-out;
}
#demoInner p { margin: 0 0 1em 0; text-align: justify; }
#demoInner h2 { font-size: 1.35em; margin: 0 0 .8em 0; font-weight: 600; }

/* dokunma bolgeleri: iframe uzerinde saydam katman */
#tapLayer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 30; display: -webkit-box; display: -webkit-flex; display: flex; }
#tzPrev { width: 30%; }
#tzMid  { width: 40%; }
#tzNext { width: 30%; }
#tapLayer.off { display: none; }

/* uygulama ici karartma */
#dimOverlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 25; background: #000; opacity: 0; pointer-events: none; }

/* ---------- READER TOOLBAR ---------- */
#rTop, #rBottom {
  position: absolute; left: 0; right: 0; z-index: 60;
  background: rgba(255,255,255,.94);
  -webkit-transition: -webkit-transform .22s ease, opacity .22s ease;
  transition: transform .22s ease, opacity .22s ease;
}
body.t-sepia #rTop, body.t-sepia #rBottom { background: rgba(246,238,220,.95); }
body.t-night #rTop, body.t-night #rBottom { background: rgba(20,22,25,.95); color: #E6E4DF; }
#rTop { top: 0; padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,.07);
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
#rBottom { bottom: 0; padding: 10px 22px 14px 22px; border-top: 1px solid rgba(0,0,0,.06); }
body.t-night #rTop { border-bottom-color: rgba(255,255,255,.08); }
body.t-night #rBottom { border-top-color: rgba(255,255,255,.08); }
#rTop.up { -webkit-transform: translateY(-102%); transform: translateY(-102%); opacity: 0; }
#rBottom.down { -webkit-transform: translateY(102%); transform: translateY(102%); opacity: 0; }
#rTitle { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; text-align: center; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; opacity: .85; }
.tbar-prog { height: 3px; border-radius: 2px; background: rgba(0,0,0,.1); overflow: hidden; }
body.t-night .tbar-prog { background: rgba(255,255,255,.15); }
.tbar-prog i { display: block; height: 100%; background: #B08A46; width: 0; }
.tbar-info { display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-justify-content: space-between; justify-content: space-between;
  font-size: 12px; opacity: .55; margin-top: 8px; }

/* ---------- PANEL / SHEET ORTAK ---------- */
.mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; background: rgba(0,0,0,.32); opacity: 0;
  -webkit-transition: opacity .2s ease; transition: opacity .2s ease; }
.mask.show { opacity: 1; }
.sheet {
  position: absolute; left: 50%; bottom: 0; z-index: 110; width: 460px; max-width: 94%;
  margin-left: -230px; margin-bottom: 14px;
  background: #fff; border-radius: 18px; overflow: hidden;
  -webkit-transform: translateY(18px); transform: translateY(18px); opacity: 0;
  -webkit-transition: -webkit-transform .2s ease, opacity .2s ease;
  transition: transform .2s ease, opacity .2s ease;
  box-shadow: 0 18px 40px rgba(0,0,0,.25);
}
.sheet.show { -webkit-transform: translateY(0); transform: translateY(0); opacity: 1; }
.sheet { max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
body.t-sepia .sheet { background: #FBF4E5; }
body.t-night .sheet { background: #1D2126; color: #E6E4DF; }
@media (max-width: 520px) { .sheet { width: 94%; margin-left: -47%; } }
.sheet-head { padding: 16px 20px 12px 20px; border-bottom: 1px solid rgba(0,0,0,.07); }
body.t-night .sheet-head { border-bottom-color: rgba(255,255,255,.09); }
.sheet-head b { font-size: 16px; font-weight: 600; display: block; }
.sheet-head span { font-size: 12px; opacity: .5; }
.sheet-item {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  width: 100%; text-align: left; padding: 15px 20px; font-size: 16px;
  border-bottom: 1px solid rgba(0,0,0,.05);
}
body.t-night .sheet-item { border-bottom-color: rgba(255,255,255,.06); }
.sheet-item:active { background: rgba(0,0,0,.05); }
body.t-night .sheet-item:active { background: rgba(255,255,255,.07); }
.sheet-item em { font-style: normal; width: 30px; -webkit-flex: none; flex: none; }
.sheet-item.danger { color: #C0392B; }
.sheet-cancel { display: block; width: 100%; padding: 16px; text-align: center; font-size: 16px; color: #2F5D50; font-weight: 500; }
body.t-night .sheet-cancel { color: #7FB6A4; }
.sheet-scroll { max-height: 58%; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ---------- Aa PANELI ---------- */
#aaPanel { z-index: 130; }
.aa-group { padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,.06); }
body.t-night .aa-group { border-bottom-color: rgba(255,255,255,.07); }
.aa-label { font-size: 11px; letter-spacing: .8px; opacity: .45; margin-bottom: 10px; }
.seg { display: -webkit-box; display: -webkit-flex; display: flex; }
.seg button {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; height: 48px; margin-right: 8px;
  border-radius: 12px; background: rgba(0,0,0,.05); font-size: 15px;
}
body.t-night .seg button { background: rgba(255,255,255,.08); }
.seg button:last-child { margin-right: 0; }
.seg button.on { background: #2F5D50; color: #fff; }
body.t-night .seg button.on { background: #3E7A69; }
.seg button.sw-light { background: #FFFFFF; color: #17181B; border: 1px solid rgba(0,0,0,.12); }
.seg button.sw-sepia { background: #F1E2C3; color: #4A3B2A; border: 1px solid rgba(0,0,0,.08); }
.seg button.sw-night { background: #1B1E22; color: #E6E4DF; border: 1px solid rgba(255,255,255,.14); }
.seg button.sw-on { -webkit-box-shadow: 0 0 0 2px #B08A46; box-shadow: 0 0 0 2px #B08A46; }
.range-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
.range-row span { font-size: 13px; opacity: .5; width: 24px; text-align: center; }
input[type=range] { -webkit-appearance: none; appearance: none; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  height: 26px; background: none; margin: 0 8px; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(0,0,0,.15); }
body.t-night input[type=range]::-webkit-slider-runnable-track { background: rgba(255,255,255,.2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 13px;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); margin-top: -11px; }
.fs-preview { font-size: 13px; opacity: .5; text-align: center; margin-top: 10px; }

/* ---------- TOC DRAWER ---------- */
#tocDrawer {
  position: absolute; top: 0; left: 0; bottom: 0; width: 330px; max-width: 84%; z-index: 120;
  background: #fff; -webkit-transform: translateX(-102%); transform: translateX(-102%);
  -webkit-transition: -webkit-transform .24s ease; transition: transform .24s ease;
  box-shadow: 2px 0 22px rgba(0,0,0,.18);
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
}
body.t-sepia #tocDrawer { background: #FBF4E5; }

<script>
/* ============================================================
   iRead - uygulama kodu (ES5, arrow function / template literal
   kullanilmaz; eski Safari icin).
   ============================================================ */

/* ---------- kisa yardimcilar ---------- */
function $(id){ return document.getElementById(id); }
function show(n){ if(n) n.className = n.className.replace(/\s*hidden/g,''); }
function hide(n){ if(n && n.className.indexOf('hidden') < 0) n.className += ' hidden'; }
function has(n, c){ return (' '+n.className+' ').indexOf(' '+c+' ') > -1; }
function addC(n, c){ if(!has(n,c)) n.className += ' ' + c; }
function remC(n, c){ n.className = (' '+n.className+' ').replace(' '+c+' ',' ').replace(/^\s+|\s+$/g,''); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return 'b' + Date.now() + '_' + Math.floor(Math.random()*100000); }
function closestEl(node, cls){
  while(node && node !== document.body){
    if(node.className && has(node, cls)) return node;
    node = node.parentNode;
  }
  return null;
}
var toastTimer = null;
function toast(msg){
  var t = $('toast'); t.innerHTML = esc(msg); addC(t,'show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ remC(t,'show'); }, 2200);
}

/* ---------- global durum ---------- */
var DB = null;
var BOOKS = [];              // tum kitaplar (order'a gore sirali)
var COLLECTIONS = [];        // kullanici koleksiyonlari
var VIEWCOLL = 'all';        // aktif koleksiyon
var QUERY = '';              // kitaplik arama metni
var CUR = null;              // acik kitap kaydi
var MODE = null;             // 'epub' | 'pdf' | 'demo'
var epubBook = null, rendition = null;
var pdfDoc = null, pdfPageNum = 1, pdfScale = 1, pdfRendering = false;
var demoPage = 0, demoPages = 1;
var coverTargetId = null;    // kapak degistirilecek kitap
var saveTimer = null;

/* ---------- ayarlar (localStorage: kucuk veriler) ---------- */
var S = { theme:'light', fontSize:18, family:'serif', lineHeight:1.6, margin:56, bright:0, view:'shelf' };
function loadSettings(){
  try{
    var raw = localStorage.getItem('iread.settings');
    if(raw){ var o = JSON.parse(raw); for(var k in o){ if(S.hasOwnProperty(k)) S[k] = o[k]; } }
    var c = localStorage.getItem('iread.collections');
    if(c) COLLECTIONS = JSON.parse(c);
  }catch(e){}
}
function saveSettings(){
  try{
    localStorage.setItem('iread.settings', JSON.stringify(S));
    localStorage.setItem('iread.collections', JSON.stringify(COLLECTIONS));
  }catch(e){}
}

/* ============================================================
   INDEXEDDB
   ============================================================ */
function initDatabase(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error('IndexedDB yok')); return; }
    var req = indexedDB.open('iRead', 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath:'id' });
      if(!db.objectStoreNames.contains('meta'))  db.createObjectStore('meta',  { keyPath:'key' });
    };
    req.onsuccess = function(e){ DB = e.target.result; res(DB); };
    req.onerror   = function(){ rej(req.error); };
  });
}
function idbPut(store, val){
  return new Promise(function(res, rej){
    var tx = DB.transaction(store, 'readwrite');
    var r = tx.objectStore(store).put(val);
    r.onsuccess = function(){ res(val); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbGet(store, key){
  return new Promise(function(res, rej){
    var r = DB.transaction(store, 'readonly').objectStore(store).get(key);
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbAll(store){
  return new Promise(function(res, rej){
    var out = [];
    var r = DB.transaction(store, 'readonly').objectStore(store).openCursor();
    r.onsuccess = function(e){
      var c = e.target.result;
      if(c){ out.push(c.value); c.continue(); } else res(out);
    };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbDel(store, key){
  return new Promise(function(res, rej){
    var r = DB.transaction(store, 'readwrite').objectStore(store).delete(key);
    r.onsuccess = function(){ res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function persistBook(b){ return idbPut('books', b); }
function persistOrder(){
  var i, chain = Promise.resolve();
  for(i = 0; i < BOOKS.length; i++){
    BOOKS[i].order = i;
    (function(bk){ chain = chain.then(function(){ return idbPut('books', bk); }); })(BOOKS[i]);
  }
  return chain;
}

/* ============================================================
   KAPAK URETIMI / DOSYA OKUMA
   ============================================================ */
function readFileAsArrayBuffer(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(fr.error); };
    fr.readAsArrayBuffer(file);
  });
}
function readFileAsDataURL(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(fr.error); };
    fr.readAsDataURL(file);
  });
}
/* blob url -> dataURL (fetch yok, XHR ile: eski Safari uyumlu) */
function blobUrlToDataURL(url){
  return new Promise(function(res, rej){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'blob';
    xhr.onload = function(){
      var fr = new FileReader();
      fr.onload = function(){ res(fr.result); };
      fr.onerror = function(){ rej(fr.error); };
      fr.readAsDataURL(xhr.response);
    };
    xhr.onerror = function(){ rej(new Error('kapak alinamadi')); };
    xhr.send();
  });
}
/* uzun kenari 320px olacak sekilde kucult (IndexedDB'yi sismekten korur) */
function shrinkDataURL(dataUrl, maxW){
  return new Promise(function(res){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ res(cv.toDataURL('image/jpeg', 0.82)); }catch(e){ res(dataUrl); }
    };
    img.onerror = function(){ res(dataUrl); };
    img.src = dataUrl;
  });
}
/* dosyasi/kapagi olmayan kitaplar icin cizilmis kapak */
var COVER_PALETTE = [
  ['#2F5D50','#1D3F36'], ['#3A4A63','#232F42'], ['#6B4438','#442A22'],
  ['#4A4066','#2E2843'], ['#5B5B3A','#3A3A25'], ['#2B4A5C','#1A2F3B']
];
function makeTextCover(title, author, seed){
  var cv = document.createElement('canvas');
  cv.width = 300; cv.height = 450;
  var c = cv.getContext('2d');
  var p = COVER_PALETTE[(seed || 0) % COVER_PALETTE.length];
  var g = c.createLinearGradient(0, 0, 300, 450);
  g.addColorStop(0, p[0]); g.addColorStop(1, p[1]);
  c.fillStyle = g; c.fillRect(0, 0, 300, 450);
  c.strokeStyle = 'rgba(176,138,70,.85)'; c.lineWidth = 2;
  c.strokeRect(20, 20, 260, 410);
  c.fillStyle = '#F2EFE9';
  c.font = '600 27px Georgia, serif';
  c.textAlign = 'center';
  var words = String(title || 'Kitap').split(' '), line = '', lines = [], i;
  for(i = 0; i < words.length; i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if(c.measureText(test).width > 224 && line){ lines.push(line); line = words[i]; }
    else line = test;
  }
  if(line) lines.push(line);
  lines = lines.slice(0, 5);
  var y = 200 - (lines.length - 1) * 17;
  for(i = 0; i < lines.length; i++){ c.fillText(lines[i], 150, y + i * 34); }
  c.fillStyle = 'rgba(242,239,233,.72)';
  c.font = '15px -apple-system, Helvetica, sans-serif';
  c.fillText(String(author || '').substr(0, 30), 150, 380);
  c.fillStyle = 'rgba(176,138,70,.9)';
  c.fillRect(120, 250, 60, 2);
  try{ return cv.toDataURL('image/jpeg', 0.85); }catch(e){ return ''; }
}

/* ============================================================
   SURUKLE-BIRAK ILE SIRALAMA (Touch Events tabanli)
   Eski Safari HTML5 drag&drop desteklemedigi icin
   touchstart/touchmove/touchend ile yazildi. Fare de desteklenir.
   ============================================================ */
var DRAG = { active:false, timer:null, id:null, node:null, ghost:null, startX:0, startY:0, moved:false, targetId:null, before:true };

function pointOf(e){
  if(e.touches && e.touches.length) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches.length) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}
function dragStart(e){
  var node = closestEl(e.target, 'book');
  if(!node){ DRAG.id = null; DRAG.node = null; return; }
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-menu')){ DRAG.id = null; DRAG.node = null; return; }
  var p = pointOf(e);
  DRAG.id = node.getAttribute('data-id');
  DRAG.node = node; DRAG.startX = p.x; DRAG.startY = p.y;
  DRAG.moved = false; DRAG.active = false; DRAG.targetId = null;
  if(DRAG.timer) clearTimeout(DRAG.timer);
  DRAG.timer = setTimeout(function(){ beginLift(p); }, 420);   // uzun basma
}
function beginLift(p){
  if(DRAG.moved || !DRAG.node) return;
  DRAG.active = true;
  addC(DRAG.node, 'lifted');
  var g = document.createElement('div');
  g.id = 'dragGhost';
  g.innerHTML = '<div class="book-cover"><img src="' + coverOf(bookById(DRAG.id)) + '" alt=""></div>';
  document.body.appendChild(g);
  DRAG.ghost = g;
  moveGhost(p);
}
function moveGhost(p){
  if(!DRAG.ghost) return;
  DRAG.ghost.style.left = (p.x - 66) + 'px';
  DRAG.ghost.style.top  = (p.y - 99) + 'px';
  DRAG.ghost.style.webkitTransform = 'scale(1.06) rotate(-2deg)';
  DRAG.ghost.style.transform = 'scale(1.06) rotate(-2deg)';
}
function dragMove(e){
  var p = pointOf(e);
  if(!DRAG.active){
    if(Math.abs(p.x - DRAG.startX) > 8 || Math.abs(p.y - DRAG.startY) > 8){
      DRAG.moved = true;
      if(DRAG.timer){ clearTimeout(DRAG.timer); DRAG.timer = null; }
    }
    return;
  }
  if(e.preventDefault) e.preventDefault();     // suruklerken sayfa kaymasin
  moveGhost(p);
  if(DRAG.ghost) DRAG.ghost.style.display = 'none';
  var under = document.elementFromPoint(p.x, p.y);
  if(DRAG.ghost) DRAG.ghost.style.display = '';
  var target = under ? closestEl(under, 'book') : null;
  clearDropMarks();
  if(target && target.getAttribute('data-id') !== DRAG.id){
    DRAG.targetId = target.getAttribute('data-id');
    var r = target.getBoundingClientRect();
    DRAG.before = (p.x < r.left + r.width / 2);
    var m = document.createElement('div');
    m.className = 'drop-mark';
    if(!DRAG.before) m.style.left = 'auto', m.style.right = '-11px';
    target.appendChild(m);
  } else DRAG.targetId = null;
}
function clearDropMarks(){
  var marks = document.getElementsByClassName('drop-mark'), i;
  for(i = marks.length - 1; i >= 0; i--) marks[i].parentNode.removeChild(marks[i]);
}
function dragEnd(e){
  if(!DRAG.node && !DRAG.active) return;          // gecersiz/eski dokunma
  if(DRAG.timer){ clearTimeout(DRAG.timer); DRAG.timer = null; }
  clearDropMarks();
  if(DRAG.ghost){ DRAG.ghost.parentNode.removeChild(DRAG.ghost); DRAG.ghost = null; }
  if(DRAG.node) remC(DRAG.node, 'lifted');
  var wasActive = DRAG.active, movedId = DRAG.id, targetId = DRAG.targetId, before = DRAG.before, moved = DRAG.moved;
  DRAG.active = false; DRAG.node = null;
  if(wasActive){
    if(targetId){ reorderBooks(movedId, targetId, before); }
    else { openMenuFor(movedId); }        // yerinde birakildi -> menu
    return;
  }
  if(!moved && movedId){ openBook(movedId, e); }  // kisa dokunma -> kitabi ac
}
function bookById(id){
  for(var i = 0; i < BOOKS.length; i++) if(BOOKS[i].id === id) return BOOKS[i];
  return null;
}
function reorderBooks(movedId, targetId, before){
  var from = -1, i;
  for(i = 0; i < BOOKS.length; i++) if(BOOKS[i].id === movedId) from = i;
  if(from < 0) return;
  var rec = BOOKS.splice(from, 1)[0];
  var to = 0;
  for(i = 0; i < BOOKS.length; i++) if(BOOKS[i].id === targetId) to = i;
  BOOKS.splice(before ? to : to + 1, 0, rec);
  persistOrder().then(function(){ renderShelves(); toast('Sıralama kaydedildi'); });
}

/* ============================================================
   KITAP EKLEME
   ============================================================ */
function addBook(file){
  if(!file) return;
  var isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  var isEpub = /\.epub$/i.test(file.name) || file.type === 'application/epub+zip';
  if(!isPdf && !isEpub){ toast('Yalnızca EPUB ve PDF eklenebilir'); return; }
  toast('Kitap ekleniyor…');
  readFileAsArrayBuffer(file).then(function(buf){
    var rec = {
      id: uid(), type: isPdf ? 'pdf' : 'epub',
      title: file.name.replace(/\.(epub|pdf)$/i, ''), author: '',
      file: buf, cover:'', customCover:null, html:null,
      position: isPdf ? 1 : null, progress:0, pages:0,
      lastOpened:0, order: BOOKS.length, favorite:false, collections:[], bookmarks:[],
      added: Date.now(), size: file.size
    };
    return (isPdf ? fillPdfMeta(rec, buf) : fillEpubMeta(rec, buf)).then(function(){
      if(!rec.cover) rec.cover = makeTextCover(rec.title, rec.author, BOOKS.length);
      BOOKS.push(rec);
      return persistBook(rec);
    });
  }).then(function(){
    renderLibrary(); toast('Kitap eklendi');
  })['catch'](function(err){
    console.log(err); toast('Kitap eklenemedi: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
  });
}
/* EPUB: baslik, yazar ve GERCEK kapak gorseli */
function fillEpubMeta(rec, buf){
  return new Promise(function(res){
    var bk;
    try{ bk = ePub(buf); }catch(e){ res(); return; }
    bk.loaded.metadata.then(function(md){
      if(md){ if(md.title) rec.title = md.title; if(md.creator) rec.author = md.creator; }
      return bk.coverUrl();
    }).then(function(url){
      if(!url) return null;
      return blobUrlToDataURL(url).then(function(d){ return shrinkDataURL(d, 320); });
    }).then(function(d){
      if(d) rec.cover = d;
      try{ bk.destroy(); }catch(e){}
      res();
    })['catch'](function(){ try{ bk.destroy(); }catch(e){} res(); });
  });
}
/* PDF: ILK SAYFAYI render edip varsayilan kapak yapar */
function fillPdfMeta(rec, buf){
  return new Promise(function(res){
    var task = pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) });
    var doc = null;
    task.promise.then(function(d){
      doc = d; rec.pages = d.numPages;
      return d.getMetadata()['catch'](function(){ return null; });
    }).then(function(meta){
      if(meta && meta.info){
        if(meta.info.Title) rec.title = meta.info.Title;
        if(meta.info.Author) rec.author = meta.info.Author;
      }
      return doc.getPage(1);
    }).then(function(page){
      var vp0 = page.getViewport({ scale: 1 });
      var scale = 320 / vp0.width;
      var vp = page.getViewport({ scale: scale });
      var cv = document.createElement('canvas');
      cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function(){
        try{ rec.cover = cv.toDataURL('image/jpeg', 0.85); }catch(e){}
      });
    }).then(function(){ try{ doc.destroy(); }catch(e){} res(); })
    ['catch'](function(){ try{ if(doc) doc.destroy(); }catch(e){} res(); });
  });
}

   ============================================================ */
function changeCover(id){
  coverTargetId = id;
  $('fileCover').value = '';
  $('fileCover').click();
}
function applyCustomCover(file){
  var b = bookById(coverTargetId);
  if(!b || !file) return;
  readFileAsDataURL(file).then(function(d){ return shrinkDataURL(d, 400); })
  .then(function(d){
    b.customCover = d;
    return persistBook(b);
  }).then(function(){ renderLibrary(); toast('Kapak güncellendi'); });
}
function restoreDefaultCover(id){
  var b = bookById(id);
  if(!b) return;
  b.customCover = null;
  var p = Promise.resolve();
  if(!b.cover && b.file && b.type === 'pdf') p = fillPdfMeta(b, b.file);
  else if(!b.cover && b.file && b.type === 'epub') p = fillEpubMeta(b, b.file);
  p.then(function(){
    if(!b.cover) b.cover = makeTextCover(b.title, b.author, 0);
    return persistBook(b);
  }).then(function(){ renderLibrary(); toast('Varsayılan kapak geri yüklendi'); });
}

function sheetAction(act, id){
  var b = bookById(id);
  if(!b && act !== 'nop') return;
  if(act === 'open'){ closeSheets(); setTimeout(function(){ openBook(id); }, 220); return; }
  if(act === 'fav'){
    b.favorite = !b.favorite;
    persistBook(b).then(function(){ renderLibrary(); });
    closeSheets(); toast(b.favorite ? 'Favorilere eklendi' : 'Favorilerden çıkarıldı'); return;
  }
  if(act === 'cover'){ closeSheets(); setTimeout(function(){ changeCover(id); }, 220); return; }
  if(act === 'defcover'){ closeSheets(); restoreDefaultCover(id); return; }
  if(act === 'reorder'){ closeSheets(); toast('Kitaba basılı tutup sürükleyin'); return; }
  if(act === 'info'){ showBookInfo(id); return; }
  if(act === 'coll'){ showCollectionPicker(id); return; }
  if(act === 'del'){
    closeSheets();
    setTimeout(function(){
      if(confirm('"' + b.title + '" silinsin mi?')){
        idbDel('books', id).then(function(){
          for(var i = 0; i < BOOKS.length; i++) if(BOOKS[i].id === id){ BOOKS.splice(i, 1); break; }
          return persistOrder();
        }).then(function(){ renderLibrary(); toast('Kitap silindi'); });
      }
    }, 240);
    return;
  }
}

/* kapak buyuyerek reader'a gecis (hafif, sadece transform) */
function flyCoverAnim(id, e){
  var node = null, all = document.getElementsByClassName('book'), i;
  for(i = 0; i < all.length; i++) if(all[i].getAttribute('data-id') === id) node = all[i];
  if(!node) return;
  var img = node.getElementsByTagName('img')[0];
  if(!img) return;
  var r = img.getBoundingClientRect();
  var fly = document.createElement('div');
  fly.id = 'flyCover';
  fly.style.left = r.left + 'px'; fly.style.top = r.top + 'px';
  fly.style.width = r.width + 'px'; fly.style.height = r.height + 'px';
  fly.innerHTML = '<img src="' + img.src + '" alt="">';
  document.body.appendChild(fly);
  setTimeout(function(){
    var w = window.innerWidth, h = window.innerHeight;
    var nh = h * 0.9, nw = nh * (r.width / r.height);
    fly.style.left = ((w - nw) / 2) + 'px'; fly.style.top = ((h - nh) / 2) + 'px';
    fly.style.width = nw + 'px'; fly.style.height = nh + 'px';
    fly.style.opacity = '0';
  }, 16);
  setTimeout(function(){ if(fly.parentNode) fly.parentNode.removeChild(fly); }, 340);
}

/* ---------- EPUB ---------- */
function loadEpubReader(b){
  try{
    epubBook = ePub(b.file);
  }catch(err){ hide($('loading')); toast('EPUB açılamadı'); return; }
  show($('epubArea'));
  applyReaderInsets();
  rendition = epubBook.renderTo('epubArea', {
    width: '100%', height: '100%', flow: 'paginated', spread: 'none', minSpreadWidth: 99999
  });
  applyEpubStyles();
  rendition.display(b.position || undefined).then(function(){
    hide($('loading'));
    toast(b.position ? 'Son kaldığın yerden devam ediliyor' : 'İyi okumalar');
  })['catch'](function(){ hide($('loading')); toast('EPUB içeriği yüklenemedi'); });

  rendition.on('relocated', function(loc){
    if(!CUR) return;
    CUR.position = loc.start.cfi;
    var p = 0;
    if(epubBook.locations && epubBook.locations.length()){
      p = epubBook.locations.percentageFromCfi(loc.start.cfi) || 0;
    } else if(loc.start.percentage != null){ p = loc.start.percentage; }
    CUR.progress = p;
    updateProgressUI(Math.round(p * 100), loc.start.displayed ? (loc.start.displayed.page + ' / ' + loc.start.displayed.total + ' (bölüm)') : '');
    updateBookmarkIcon();
    saveProgress(false);
  });
  /* konum tablosu: bir kez hesaplanip meta store'a kaydedilir */
  idbGet('meta', 'loc_' + b.id).then(function(m){
    if(m && m.value){ epubBook.locations.load(m.value); }
    else {
      epubBook.ready.then(function(){
        return epubBook.locations.generate(1400);
      }).then(function(){
        idbPut('meta', { key:'loc_' + b.id, value: epubBook.locations.save() });
      })['catch'](function(){});
    }
  })['catch'](function(){});

  epubBook.loaded.navigation.then(function(nav){ buildToc(nav ? nav.toc : []); })['catch'](function(){});
}
function applyEpubStyles(){
  if(!rendition) return;
  var t = themeColors();
  var fam = (S.family === 'serif')
    ? '"Iowan Old Style", Palatino, Georgia, serif'
    : '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
  rendition.themes.default({
    'body': { 'background': t.bg, 'color': t.fg, 'font-family': fam + ' !important',
              'line-height': S.lineHeight + ' !important', 'padding': '0 !important', 'margin': '0 !important' },
    'p, li, div, span': { 'font-family': fam + ' !important', 'line-height': S.lineHeight + ' !important', 'color': t.fg + ' !important' },
    'h1, h2, h3': { 'color': t.fg + ' !important' },
    'a': { 'color': '#B08A46 !important' },
    'img': { 'max-width': '100% !important' }
  });
  rendition.themes.fontSize(S.fontSize + 'px');
}
/* kenar bosluklarini kapsayicidan uygular (sayfalama bozulmaz) */

/* ---------- PDF ---------- */
function loadPdfReader(b){
  show($('pdfArea'));
  var task = pdfjsLib.getDocument({ data: new Uint8Array(b.file.slice(0)) });
  task.promise.then(function(doc){
    pdfDoc = doc;
    b.pages = doc.numPages;
    pdfPageNum = Math.min(Math.max(1, b.position || 1), doc.numPages);
    pdfScale = 1;
    buildPdfOutline();
    return renderPdfPage(pdfPageNum);
  }).then(function(){
    hide($('loading'));
    if(b.position > 1) toast('Son kaldığın sayfadan devam ediliyor');
  })['catch'](function(err){ hide($('loading')); toast('PDF açılamadı'); console.log(err); });
}
function renderPdfPage(n){
  if(!pdfDoc || pdfRendering) return Promise.resolve();
  pdfRendering = true;
  return pdfDoc.getPage(n).then(function(page){
    var area = $('pdfArea'), cv = $('pdfCanvas');
    var vp0 = page.getViewport({ scale: 1 });
    var fit = (area.clientWidth - 24) / vp0.width;
    var vp = page.getViewport({ scale: fit * pdfScale });
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    cv.style.width = Math.round(vp.width) + 'px';
    return page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }).then(function(){
    pdfRendering = false;
    pdfPageNum = n;
    $('pdfArea').scrollTop = 0;
    if(CUR){
      CUR.position = n;
      CUR.progress = pdfDoc.numPages > 1 ? (n - 1) / (pdfDoc.numPages - 1) : 1;
      saveProgress(false);
    }
    updateProgressUI(Math.round((CUR ? CUR.progress : 0) * 100), 'Sayfa ' + n + ' / ' + pdfDoc.numPages);
    updateBookmarkIcon();
  })['catch'](function(){ pdfRendering = false; });
}
function buildPdfOutline(){
  if(!pdfDoc) return;
  pdfDoc.getOutline().then(function(out){
    if(!out || !out.length){ buildToc([]); return; }
    var items = [], i;
    for(i = 0; i < out.length; i++) items.push({ label: out[i].title, dest: out[i].dest });
    buildToc(items);
  })['catch'](function(){ buildToc([]); });
}
function pdfGotoDest(dest){
  if(!pdfDoc || !dest) return;
  var p = (typeof dest === 'string') ? pdfDoc.getDestination(dest) : Promise.resolve(dest);
  p.then(function(d){
    if(!d) return;
    return pdfDoc.getPageIndex(d[0]).then(function(idx){ renderPdfPage(idx + 1); });
  })['catch'](function(){});
}

/* ---------- DEMO KITAP ---------- */
function loadDemoReader(b){
  show($('demoArea'));
  var inner = $('demoInner');
  inner.innerHTML = b.html || '<p>İçerik yok.</p>';
  applyDemoStyles();
  applyReaderInsets();
  setTimeout(function(){
    layoutDemo();
    demoPage = Math.min(b.position || 0, demoPages - 1);
    if(demoPage < 0) demoPage = 0;
    paintDemo();
    hide($('loading'));
    if(b.position) toast('Son kaldığın yerden devam ediliyor');
    buildToc(demoToc(b));
  }, 60);
}
function applyDemoStyles(){
  var inner = $('demoInner'), t = themeColors();
  inner.style.fontSize = S.fontSize + 'px';
  inner.style.lineHeight = S.lineHeight;
  inner.style.color = t.fg;
  inner.className = (S.family === 'serif') ? 'serif' : '';
}
function layoutDemo(){
  var area = $('demoArea'), inner = $('demoInner');
  var step = area.clientWidth;
  var sw = inner.scrollWidth;
  demoPages = Math.max(1, Math.round((sw + S.margin * 2) / step));
  if(CUR) CUR.pages = demoPages;
}
function paintDemo(){
  var area = $('demoArea'), inner = $('demoInner');
  var step = area.clientWidth;
  var x = -demoPage * step;
  inner.style.webkitTransform = 'translate3d(' + x + 'px,0,0)';
  inner.style.transform = 'translate3d(' + x + 'px,0,0)';
  if(CUR){
    CUR.position = demoPage;
    CUR.progress = demoPages > 1 ? demoPage / (demoPages - 1) : 1;
    saveProgress(false);
  }
  updateProgressUI(Math.round((CUR ? CUR.progress : 0) * 100), 'Sayfa ' + (demoPage + 1) + ' / ' + demoPages);
  updateBookmarkIcon();
}
function demoToc(b){
  var items = [], tmp = document.createElement('div'), i;
  tmp.innerHTML = b.html || '';
  var hs = tmp.getElementsByTagName('h2');
  for(i = 0; i < hs.length; i++) items.push({ label: hs[i].innerHTML, idx: i });
  return items;
}
function gotoDemoHeading(idx){
  var inner = $('demoInner'), area = $('demoArea');
  var hs = inner.getElementsByTagName('h2');
  if(!hs[idx]) return;
  var left = hs[idx].offsetLeft;
  demoPage = Math.max(0, Math.round(left / area.clientWidth));
  paintDemo();
}

  else if(MODE === 'pdf' && pdfDoc){ if(pdfPageNum < pdfDoc.numPages) renderPdfPage(pdfPageNum + 1); }
  else if(MODE === 'demo'){ if(demoPage < demoPages - 1){ demoPage++; paintDemo(); } }

function prevPage(){
  if(MODE === 'epub' && rendition) rendition.prev();
  else if(MODE === 'pdf' && pdfDoc){ if(pdfPageNum > 1) renderPdfPage(pdfPageNum - 1); }
  else if(MODE === 'demo'){ if(demoPage > 0){ demoPage--; paintDemo(); } }

  saveTimer = setTimeout(function(){ persistBook(rec); }, 700);

/* ---------- kitap ici arama ---------- */
function searchBook(q){
  if(!q || q.length < 2){ toast('En az 2 karakter yazın'); return; }
  $('tocList').innerHTML = '<div class="tiny">Aranıyor…</div>';
  if(MODE === 'epub') searchEpub(q);
  else if(MODE === 'pdf') searchPdf(q);
  else searchDemo(q);
}
function renderResults(res){
  var h = '', i;
  if(!res.length){ $('tocList').innerHTML = '<div class="tiny">Sonuç bulunamadı.</div>'; return; }
  for(i = 0; i < res.length && i < 80; i++){
    h += '<button class="res-item" data-res="' + i + '">' + res[i].html + '</button>';
  }
  $('tocList').innerHTML = h;
  window.__results = res;
}
function markup(text, q){
  var idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx < 0) return esc(text.substr(0, 120));
  var a = Math.max(0, idx - 45);
  var s = text.substr(a, 130);
  var rel = idx - a;
  return esc(s.substr(0, rel)) + '<b>' + esc(s.substr(rel, q.length)) + '</b>' + esc(s.substr(rel + q.length));
}
function searchEpub(q){
  if(!epubBook) return;
  var items = [], res = [];
  epubBook.spine.each(function(item){ items.push(item); });
  var chain = Promise.resolve(), i;
  for(i = 0; i < items.length; i++){
    (function(item){
      chain = chain.then(function(){
        return item.load(epubBook.load.bind(epubBook)).then(function(){
          var found = item.find(q) || [];
          for(var k = 0; k < found.length; k++){
            res.push({ type:'epub', cfi: found[k].cfi, html: markup(found[k].excerpt, q) });
          }
          item.unload();
        })['catch'](function(){});
      });
    })(items[i]);
  }
  chain.then(function(){ renderResults(res); });
}
function searchPdf(q){
  if(!pdfDoc) return;
  var res = [], total = Math.min(pdfDoc.numPages, 300);
  var chain = Promise.resolve(), i;
  for(i = 1; i <= total; i++){
    (function(n){
      chain = chain.then(function(){
        return pdfDoc.getPage(n).then(function(p){ return p.getTextContent(); }).then(function(tc){
          var txt = '', k;
          for(k = 0; k < tc.items.length; k++) txt += tc.items[k].str + ' ';
          if(txt.toLowerCase().indexOf(q.toLowerCase()) > -1){
            res.push({ type:'pdf', page:n, html:'<span style="opacity:.5">Sayfa ' + n + '</span><br>' + markup(txt, q) });
          }
        })['catch'](function(){});
      });
    })(i);
  }
  chain.then(function(){ renderResults(res); });
}
function searchDemo(q){
  var res = [], ps = $('demoInner').getElementsByTagName('p'), i;
  var step = $('demoArea').clientWidth;
  for(i = 0; i < ps.length; i++){
    var txt = ps[i].textContent || ps[i].innerText || '';
    if(txt.toLowerCase().indexOf(q.toLowerCase()) > -1){
      res.push({ type:'demo', page: Math.round(ps[i].offsetLeft / step), html: markup(txt, q) });
    }
  }
  renderResults(res);
}
function gotoResult(i){
  var r = window.__results && window.__results[i];
  if(!r) return;
  closeDrawer();
  if(r.type === 'epub' && rendition) rendition.display(r.cfi);
  else if(r.type === 'pdf') renderPdfPage(r.page);
  else { demoPage = Math.max(0, Math.min(r.page, demoPages - 1)); paintDemo(); }
}

/* ---------- yer imleri ---------- */
function currentLoc(){
  if(MODE === 'epub') return CUR ? CUR.position : null;
  if(MODE === 'pdf') return pdfPageNum;
  return demoPage;
}
function bookmarkIndex(){
  if(!CUR || !CUR.bookmarks) return -1;
  var loc = currentLoc(), i;
  for(i = 0; i < CUR.bookmarks.length; i++) if(CUR.bookmarks[i].loc === loc) return i;
  return -1;
}
function updateBookmarkIcon(){
  var on = bookmarkIndex() > -1;
  $('bmIcon').setAttribute('fill', on ? '#B08A46' : 'none');
  $('bmIcon').setAttribute('stroke', on ? '#B08A46' : 'currentColor');
}
function toggleBookmark(){
  if(!CUR) return;
  if(!CUR.bookmarks) CUR.bookmarks = [];
  var i = bookmarkIndex();
  if(i > -1){ CUR.bookmarks.splice(i, 1); toast('Yer imi kaldırıldı'); }
  else {
    var label = (MODE === 'pdf') ? ('Sayfa ' + pdfPageNum)
              : (MODE === 'demo') ? ('Sayfa ' + (demoPage + 1))
              : ('%' + pct(CUR) + ' konumu');
    CUR.bookmarks.push({ loc: currentLoc(), label: label, sub: new Date().toLocaleDateString() });
    toast('Yer imi eklendi');
  }
  persistBook(CUR);
  updateBookmarkIcon();
}
function gotoBookmark(i){
  var bm = CUR && CUR.bookmarks && CUR.bookmarks[i];
  if(!bm) return;
  closeDrawer();
  if(MODE === 'epub' && rendition) rendition.display(bm.loc);
  else if(MODE === 'pdf') renderPdfPage(bm.loc);
  else { demoPage = bm.loc; paintDemo(); }
}

/* ============================================================
   DOKUNMATIK KONTROLLER + IKI PARMAK KISTIRMA (PINCH-IN)
   Tek parmak: sayfa cevirme / toolbar
   Iki parmak kistirma: kitapliga don
   ============================================================ */
var TOUCH = { x:0, y:0, t:0, lastY:0, multi:false };
var PINCH = { active:false, start:0, fired:false };

function dist2(t){
  var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}
function stageScale(v){
  var s = $('readerStage');
  s.style.webkitTransform = 'scale(' + v + ')';
  s.style.transform = 'scale(' + v + ')';
}
function handlePinchGesture(e, phase){
  if(phase === 'start'){
    PINCH.active = true; PINCH.fired = false;
    PINCH.start = dist2(e.touches);
    if(e.preventDefault) e.preventDefault();
    return;
  }
  if(phase === 'move'){
    if(!PINCH.active) return;
    if(e.preventDefault) e.preventDefault();
    var d = dist2(e.touches);
    var ratio = PINCH.start > 0 ? d / PINCH.start : 1;
    if(ratio < 1) stageScale(Math.max(0.86, ratio));      // hafif gorsel geri bildirim
    /* esik: baslangic >= 110px ve en az %40 daralma */
    if(!PINCH.fired && PINCH.start >= 110 && d <= PINCH.start * 0.6 && (PINCH.start - d) >= 60){
      PINCH.fired = true;
      stageScale(0.86);
      setTimeout(function(){ stageScale(1); goBackToLibrary(); }, 90);
    }
    return;
  }
  PINCH.active = false;
  stageScale(1);
}
function bindReaderTouch(){
  var layer = $('tapLayer');
  layer.addEventListener('touchstart', function(e){
    if(e.touches.length >= 2){ TOUCH.multi = true; handlePinchGesture(e, 'start'); return; }
    TOUCH.multi = false;
    TOUCH.x = e.touches[0].clientX; TOUCH.y = e.touches[0].clientY;
    TOUCH.lastY = e.touches[0].clientY; TOUCH.t = Date.now();
  }, false);
  layer.addEventListener('touchmove', function(e){
    if(e.touches.length >= 2){ TOUCH.multi = true; handlePinchGesture(e, 'move'); return; }
    if(TOUCH.multi && e.preventDefault){ e.preventDefault(); return; }
    /* PDF: tap katmani ustte oldugu icin dikey kaydirmayi elle yapiyoruz */
    if(MODE === 'pdf' && e.touches.length === 1){
      var ty = e.touches[0].clientY;
      var dyy = ty - TOUCH.lastY;
      TOUCH.lastY = ty;
      if(Math.abs(ty - TOUCH.y) > 12){
        $('pdfArea').scrollTop -= dyy;
        if(e.preventDefault) e.preventDefault();
      }
    }
  }, false);
  layer.addEventListener('touchend', function(e){
    if(PINCH.active || TOUCH.multi){
      handlePinchGesture(e, 'end');
      if(e.touches.length === 0) setTimeout(function(){ TOUCH.multi = false; }, 260);
      return;
    }
    var t = e.changedTouches[0];
    var dx = t.clientX - TOUCH.x, dy = t.clientY - TOUCH.y;
    var dt = Date.now() - TOUCH.t;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) && dt < 800){
      if(dx < 0) nextPage(); else prevPage();      // saga kaydir -> onceki
      return;
    }
    if(Math.abs(dx) < 14 && Math.abs(dy) < 14) tapAt(t.clientX);
  }, false);
  /* masaustu/fare */
  layer.addEventListener('click', function(e){
    if(('ontouchstart' in window)) return;
    tapAt(e.clientX);
  }, false);
}
function tapAt(x){
  var w = window.innerWidth;
  if(x < w * 0.3) prevPage();
  else if(x > w * 0.7) nextPage();
  else toggleToolbar();
}

/* ============================================================
   OLAY BAGLAMA
   ============================================================ */
function bindEvents(){
  /* --- kitaplik ust bar --- */
  $('btnAdd').onclick = function(){ $('fileBook').value = ''; $('fileBook').click(); };
  $('fileBook').onchange = function(){ if(this.files && this.files[0]) addBook(this.files[0]); };
  $('fileCover').onchange = function(){ if(this.files && this.files[0]) applyCustomCover(this.files[0]); };
  $('btnLibSearch').onclick = function(){
    var bar = $('libSearchBar');
    if(has(bar, 'hidden')){ show(bar); setTimeout(function(){ try{ $('libSearchInput').focus(); }catch(e){} }, 60); }
    else { hide(bar); QUERY = ''; $('libSearchInput').value = ''; renderShelves(); }
  };
  $('btnSearchClose').onclick = function(){ hide($('libSearchBar')); QUERY = ''; $('libSearchInput').value = ''; renderShelves(); };
  $('libSearchInput').oninput = function(){ QUERY = this.value; renderShelves(); };
  $('btnView').onclick = function(){
    S.view = (S.view === 'shelf') ? 'list' : 'shelf';
    saveSettings(); renderShelves(); toast(S.view === 'shelf' ? 'Raf görünümü' : 'Liste görünümü');
  };
  /* --- koleksiyon seridi --- */
  $('collBar').onclick = function(e){
    var b = e.target;
    if(b.getAttribute && b.getAttribute('data-newcoll')){
      askText('Yeni koleksiyon', 'Koleksiyon adı', function(name){
        if(!name) return;
        if(COLLECTIONS.indexOf(name) < 0) COLLECTIONS.push(name);
        saveSettings(); renderCollections(); toast('Koleksiyon oluşturuldu');
      });
      return;
    }
    var c = b.getAttribute && b.getAttribute('data-coll');
    if(c){ VIEWCOLL = c; renderCollections(); renderShelves(); }
  };
  /* --- simdi oku --- */
  $('nowReading').onclick = function(e){
    var card = closestEl(e.target, 'now-card');
    if(card) openBook(card.getAttribute('data-open'));
  };
  /* --- raflar: dokunma + surukleme --- */
  var sh = $('shelves');
  sh.addEventListener('touchstart', function(e){
    var m = e.target.getAttribute && e.target.getAttribute('data-menu');
    if(m) return;
    dragStart(e);
  }, false);
  sh.addEventListener('touchmove', dragMove, false);
  sh.addEventListener('touchend', dragEnd, false);
  sh.addEventListener('touchcancel', function(){ if(DRAG.timer) clearTimeout(DRAG.timer); DRAG.active = false; clearDropMarks(); if(DRAG.ghost){ DRAG.ghost.parentNode.removeChild(DRAG.ghost); DRAG.ghost = null; } }, false);
  sh.onmousedown = function(e){ if(!('ontouchstart' in window)) dragStart(e); };
  document.onmousemove = function(e){ if(DRAG.node && !('ontouchstart' in window)) dragMove(e); };
  document.onmouseup = function(e){ if(DRAG.node && !('ontouchstart' in window)) dragEnd(e); };
  sh.onclick = function(e){
    var m = e.target.getAttribute && e.target.getAttribute('data-menu');
    if(m){ openMenuFor(m); return; }
  };
  /* --- alt menuler --- */
  $('sheetMask').onclick = closeSheets;
  $('bsCancel').onclick = closeSheets;
  $('bsBody').onclick = function(e){
    var n = e.target, act = null, ct = null, cn = null;
    while(n && n !== this){
      if(n.getAttribute){
        act = act || n.getAttribute('data-act');
        ct = ct || n.getAttribute('data-coll-toggle');
        cn = cn || n.getAttribute('data-coll-new');
      }
      n = n.parentNode;
    }
    var id = this.getAttribute('data-id');
    if(ct){ toggleCollection(id, ct); return; }
    if(cn){
      askText('Yeni koleksiyon', 'Koleksiyon adı', function(name){
        if(!name) return;
        if(COLLECTIONS.indexOf(name) < 0) COLLECTIONS.push(name);
        saveSettings(); renderCollections();
        toggleCollection(id, name);
      });
      return;
    }
    if(act) readerOrBookAction(act, id);
  };
  $('pmCancel').onclick = closeSheets;
  $('pmOk').onclick = function(){
    var v = $('pmInput').value.replace(/^\s+|\s+$/g, '');
    var cb = promptCb; promptCb = null;
    closeSheets();
    if(cb) setTimeout(function(){ cb(v); }, 240);
  };
  /* --- reader ust bar --- */
  $('btnBack').onclick = goBackToLibrary;
  $('btnToc').onclick = function(){ openDrawer('toc'); };
  $('btnFind').onclick = function(){ openDrawer('find'); };
  $('btnBookmark').onclick = toggleBookmark;
  $('btnAa').onclick = function(){ syncAaPanel(); openSheet($('aaPanel')); };
  $('btnMore').onclick = openReaderMenu;
  $('drawerMask').onclick = closeDrawer;
  $('btnFindGo').onclick = function(){ searchBook($('findInput').value); };
  $('findInput').onkeydown = function(e){ if(e.keyCode === 13) searchBook(this.value); };
  $('tocList').onclick = function(e){
    var n = e.target, ti = null, bm = null, rs = null;
    while(n && n !== this){
      if(n.getAttribute){
        ti = ti || n.getAttribute('data-toc');
        bm = bm || n.getAttribute('data-bm');
        rs = rs || n.getAttribute('data-res');
      }
      n = n.parentNode;
    }
    if(ti !== null && ti !== undefined) gotoToc(parseInt(ti, 10));
    else if(bm !== null && bm !== undefined) gotoBookmark(parseInt(bm, 10));
    else if(rs !== null && rs !== undefined) gotoResult(parseInt(rs, 10));
  };
  /* --- Aa paneli --- */
  $('aaClose').onclick = closeSheets;
  $('segTheme').onclick = function(e){
    var th = e.target.getAttribute && e.target.getAttribute('data-th');
    if(th) toggleTheme(th);
  };
  $('btnFsUp').onclick = function(){ changeFontSize(1); };
  $('btnFsDown').onclick = function(){ changeFontSize(-1); };
  $('segFamily').onclick = function(e){
    var f = e.target.getAttribute && e.target.getAttribute('data-ff');
    if(f) setFamily(f);
  };
  $('segLine').onclick = function(e){
    var v = e.target.getAttribute && e.target.getAttribute('data-lh');
    if(v) setLineHeight(parseFloat(v));
  };
  $('segMargin').onclick = function(e){
    var v = e.target.getAttribute && e.target.getAttribute('data-mg');
    if(v) setMargin(parseInt(v, 10));
  };
  $('rngBright').onchange = function(){ S.bright = parseInt(this.value, 10); saveSettings(); applyBrightness(); };
  $('rngBright').oninput = function(){ S.bright = parseInt(this.value, 10); applyBrightness(); };

  bindReaderTouch();

  /* Safari'nin kendi zoom hareketini engelle (pinch ile cakismasin) */
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, false);
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, false);
  document.addEventListener('touchmove', function(e){
    if(!has($('reader'), 'hidden') && e.touches.length > 1 && e.preventDefault) e.preventDefault();
  }, false);

  /* yon degisimi / yeniden boyutlanma */
  var rsT = null;
  window.onresize = function(){
    if(rsT) clearTimeout(rsT);
    rsT = setTimeout(function(){
      if(has($('reader'), 'hidden')) renderShelves();
      else {
        applyReaderInsets();
        if(MODE === 'epub' && rendition){ try{ rendition.resize($('epubArea').clientWidth, $('epubArea').clientHeight); }catch(e){} }
        if(MODE === 'pdf') renderPdfPage(pdfPageNum);
        if(MODE === 'demo'){ layoutDemo(); if(demoPage > demoPages - 1) demoPage = demoPages - 1; paintDemo(); }
      }
    }, 250);
  };
  /* klavye (masaustu testi icin) */
  document.onkeydown = function(e){
    if(has($('reader'), 'hidden')) return;
    if(e.keyCode === 39) nextPage();
    else if(e.keyCode === 37) prevPage();
    else if(e.keyCode === 27) goBackToLibrary();
  };
}
/* kitaplik menusu ile reader menusu ayni panelde calisir */
function readerOrBookAction(act, id){
  if(act === 'rbm'){ closeSheets(); setTimeout(function(){ openDrawer('bm'); }, 220); return; }
  if(act === 'rback'){ closeSheets(); setTimeout(goBackToLibrary, 220); return; }
  if(act === 'zin'){ pdfScale = Math.min(3, pdfScale + 0.25); renderPdfPage(pdfPageNum); closeSheets(); return; }
  if(act === 'zout'){ pdfScale = Math.max(0.5, pdfScale - 0.25); renderPdfPage(pdfPageNum); closeSheets(); return; }
  sheetAction(act, id);
}
function openReaderMenu(){
  if(!CUR) return;
  $('bsTitle').innerHTML = esc(CUR.title);
  $('bsSub').innerHTML = '%' + pct(CUR) + ' okundu';
  var h = '';
  h += sheetRow('🔖', 'Yer imlerim', 'rbm');
  if(MODE === 'pdf'){
    h += sheetRow('➕', 'Yakınlaştır', 'zin');
    h += sheetRow('➖', 'Uzaklaştır', 'zout');
  }
  h += sheetRow(CUR.favorite ? '💔' : '❤️', CUR.favorite ? 'Favorilerden çıkar' : 'Favorilere ekle', 'fav');
  h += sheetRow('🖼️', 'Kapak değiştir', 'cover');
  h += sheetRow('ℹ️', 'Kitap bilgileri', 'info');
  h += sheetRow('📚', 'Kitaplığa dön', 'rback');
  $('bsBody').innerHTML = h;
  $('bsBody').setAttribute('data-id', CUR.id);
  openSheet($('bookSheet'));
}

/* ============================================================
   BASLANGIC
   ============================================================ */
function initApp(){
  loadSettings();
  document.body.className = 't-' + S.theme;
  applyBrightness();
  syncAaPanel();
  bindEvents();
  if(window.pdfjsLib && pdfjsLib.GlobalWorkerOptions){
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js';
  }
  initDatabase().then(loadLibrary)['catch'](function(err){
    console.log(err);
    $('shelves').innerHTML = '<div class="tiny">Depolama açılamadı. Safari’de Özel Gezinme kapalı olmalı.</div>';
  });
}
if(document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(initApp, 0);
else window.addEventListener('DOMContentLoaded', initApp, false);
</script>
